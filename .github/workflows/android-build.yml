name: Build and Release Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35, NDK and CMake
        run: |
          SDKMGR="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager | head -n 1)"
          yes | "$SDKMGR" --licenses > /dev/null || true
          "$SDKMGR" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Run Unit Tests & Assemble Debug APK
        run: gradle testDebugUnitTest assembleDebug --stacktrace

      - name: Prepare Release APK Name
        run: cp app/build/outputs/apk/debug/app-debug.apk TelePhoto-Editor-v1.0.0-debug.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TelePhoto-Editor-debug-apk
          path: TelePhoto-Editor-v1.0.0-debug.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: TelePhoto Editor v1.0.0
          body: |
            Standalone Android photo editor extracted directly from **Telegram for Android (`DrKLO/Telegram` 13.2.2)**.

            ### Included Real Telegram Engines
            - **OpenGL ES 2.0 Filters, Curves & Blur:** Enhance (native C++ `calcCDT`), Exposure, Contrast, Saturation, Warmth, Fade, Highlights, Shadows, Vignette, Grain, Sharpen, Soften Skin, Tint Shadows/Highlights, RGB/Luma Curves, Radial & Linear Tilt-Shift Blur.
            - **Crop & Rotate:** Free rotation wheel (-45° to +45°), 90° rotate, horizontal mirror, aspect-ratio lock presets.
            - **GPU Paint & Text:** Pen, Arrow, Marker, Neon, Blur (native C++ `stackBlurBitmap`), Eraser, Circle/Rect/Star shapes, Undo stack, and interactive styled text overlays.
          files: TelePhoto-Editor-v1.0.0-debug.apk
          make_latest: true
